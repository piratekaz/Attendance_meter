<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Desk — Attendance & Topic Tracker</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#12151b; --bg-2:#181c24; --panel:#1d212a;
  --line:#2a2f3a; --ink:#eceef2; --ink-soft:#9aa1b0;
  --brass:#c9a24b; --brass-soft:#3a331f;
  --blue:#5b8def; --moss:#6fae7f;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1ec; --bg-2:#ece9e1; --panel:#fffdf9;
    --line:#ded8c9; --ink:#221f19; --ink-soft:#6c6656;
    --brass:#8a6a1e; --brass-soft:#f1e6c8;
  }
}
:root[data-theme="light"]{
  --bg:#f3f1ec; --bg-2:#ece9e1; --panel:#fffdf9;
  --line:#ded8c9; --ink:#221f19; --ink-soft:#6c6656;
  --brass:#8a6a1e; --brass-soft:#f1e6c8;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit;cursor:pointer}

/* ── NAV ───────────────────────────────────────────────── */
nav{
  flex:0 0 auto;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:var(--bg-2);border-bottom:1px solid var(--line);
}
.brand{
  font-family:'Fraunces',serif;font-weight:600;font-size:17px;
  margin-right:auto;letter-spacing:.2px;display:flex;align-items:center;gap:8px;
  cursor:pointer;
}
.brand .mark{
  width:26px;height:26px;border-radius:7px;background:var(--brass);
  color:var(--bg-2);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
}
.tab{
  border:1px solid var(--line);background:transparent;color:var(--ink-soft);
  font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;
  transition:background .15s,color .15s,border-color .15s;
}
.tab:hover{color:var(--ink);border-color:var(--brass)}
.tab.active{background:var(--brass-soft);color:var(--brass);border-color:var(--brass)}

/* ── HOME ──────────────────────────────────────────────── */
#home{
  max-width:760px;margin:0 auto;padding:64px 22px 60px;
  width:100%;overflow-y:auto;
}
#home .eyebrow{color:var(--ink-soft);font-size:13px;margin-bottom:8px}
#home h1{
  font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,5vw,40px);
  line-height:1.15;margin:0 0 34px;max-width:14ch;
}
.deck{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.deck{grid-template-columns:1fr}}
.deck-card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:24px;text-align:left;display:flex;flex-direction:column;gap:10px;
  transition:transform .2s cubic-bezier(.22,1,.36,1),border-color .2s;
  min-height:150px;
}
.deck-card:hover{transform:translateY(-3px);border-color:var(--brass)}
.deck-card .ico{font-size:24px}
.deck-card .name{font-family:'Fraunces',serif;font-weight:600;font-size:19px}
.deck-card .desc{font-size:13px;color:var(--ink-soft);line-height:1.5}

/* ── FRAMES ────────────────────────────────────────────── */
.view{display:none;flex:1 1 auto;min-height:0}
.view.active{display:flex;flex-direction:column}
.view iframe{width:100%;flex:1 1 auto;min-height:0;border:0;display:block;background:var(--panel)}
#home.active{display:block}
.loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);font-size:13px;
}

/* Desk additions */
.deck-card .desc{min-height:38px}
</style>
</head>
<body>
<nav>
  <div class="brand" onclick="showView('home')"><span class="mark">D</span>Desk</div>
  <button class="tab" data-view="home" onclick="showView('home')">Home</button>
  <button class="tab" data-view="attendance" onclick="showView('attendance')">Attendance</button>
  <button class="tab" data-view="topics" onclick="showView('topics')">Topic Tracker</button>
</nav>

<div id="home" class="view">
  <div class="eyebrow">Three things, one desk</div>
  <h1>What are you keeping tabs on today?</h1>
  <div class="deck">
    <button class="deck-card" onclick="showView('attendance')">
      <span class="ico">📊</span>
      <span class="name">Attendance</span>
      <span class="desc">Track attendance by subject, present/absent classes, percentages and thresholds.</span>
    </button>
    <button class="deck-card" onclick="showView('topics')">
      <span class="ico">📖</span>
      <span class="name">Topic Tracker</span>
      <span class="desc">Track covered and remaining topics subject by subject.</span>
    </button>
  </div>
</div>

<div id="view-attendance" class="view" style="position:relative">
  <div class="loading" id="loading-attendance">Loading Attendance…</div>
  <iframe id="frame-attendance" title="Attendance"></iframe>
</div>

<div id="view-topics" class="view" style="position:relative">
  <div class="loading" id="loading-topics">Loading Topic Tracker…</div>
  <iframe id="frame-topics" title="Topic Tracker"></iframe>
</div>

<script>
const SOURCES = {
  attendance: atob(document.getElementById('src-attendance').textContent),
  topics: atob(document.getElementById('src-topics').textContent)
};
const loaded = {attendance:false, topics:false};

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.view === name)
  );

  if (name === 'home') {
    document.getElementById('home').classList.add('active');
    return;
  }

  const view = document.getElementById('view-' + name);
  view.classList.add('active');

  if (!loaded[name]) {
    const frame = document.getElementById('frame-' + name);
    frame.srcdoc = SOURCES[name];
    frame.addEventListener('load', () => {
      const l = document.getElementById('loading-' + name);
      if (l) l.style.display = 'none';
    }, {once:true});
    loaded[name] = true;
  }
}

showView('home');
</script>
